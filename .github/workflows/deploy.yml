name: Build rankings and deploy to GitHub Pages

# The WCA publishes a new results export every night (around 00:30 UTC).
# This runs twice a day; a run first checks whether the export is newer than
# what's live and skips the build if not, so the second run is a cheap retry
# for the nights the export is late.

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 3,15 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write # only for the keepalive commit below
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - id: compare
        name: Is there a newer WCA export than the live site's?
        env:
          EVENT: ${{ github.event_name }}
          SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          set -euo pipefail
          latest=$(curl -fsSL https://www.worldcubeassociation.org/api/v0/export/public | jq -r .export_date)
          live=$(curl -fsSL "$SITE/data/meta.json" | jq -r .exportDate || echo "")
          echo "latest export: $latest"
          echo "live site:     ${live:-none}"
          if [ "$EVENT" != "schedule" ] || [ -z "$live" ] || [ "$(date -d "$latest" +%s)" -gt "$(date -d "$live" +%s)" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Live site already has this export; skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

      # GitHub switches off scheduled workflows in a public repo after 60 days
      # without repository activity. When the last commit on main is more
      # than 50 days old, push an empty commit so the schedule never lapses.
      # "[skip ci]" keeps that push from triggering another build.
      - uses: actions/checkout@v4
        if: github.event_name == 'schedule'
      - name: Keepalive commit
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          age_days=$(( ( $(date +%s) - $(git log -1 --format=%ct) ) / 86400 ))
          echo "Last commit on main: $age_days days ago"
          if [ "$age_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the nightly schedule active [skip ci]"
            git push
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Download the WCA results export
        run: |
          set -euo pipefail
          url=$(curl -fsSL https://www.worldcubeassociation.org/api/v0/export/public | jq -r .tsv_url)
          mkdir -p .cache
          time curl -fsSL -o .cache/export.zip "$url"
          # Skip the tables the pipeline doesn't read (~400 MB unzipped).
          time unzip -q -o .cache/export.zip -d .cache/tsv \
            -x WCA_export_scrambles.tsv WCA_export_ranks_single.tsv WCA_export_ranks_average.tsv
          rm .cache/export.zip
          cat .cache/tsv/metadata.json

      - run: npm run data
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
